<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UKR LIBERATION — Карта подій в Україні</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
:root {
  --bg: rgba(15, 21, 34, 0.9);
  --fg: #f8fafc;
  --mut: #94a3b8;
  --line: rgba(255, 255, 255, 0.12);
  --hov: rgba(255, 255, 255, 0.08);
  --acc: #2563eb;
  --gold: #f5b400;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: rgba(255, 255, 255, 0.9);
    --fg: #0f172a;
    --mut: #475569;
    --line: rgba(15, 23, 42, 0.12);
    --hov: rgba(15, 23, 42, 0.06);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
  }
}

* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  font: 14.5px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--fg);
  background: #060a12;
  overflow: hidden;
}

#map { position: absolute; inset: 0; z-index: 1; }

.box {
  background: var(--bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  transition: transform .22s ease, opacity .22s ease, background .2s, border-color .2s;
}

button, input, select, textarea { font: inherit; color: inherit; outline: none; }
button {
  background: none;
  border: 0;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 10px;
  transition: background .15s, transform .1s;
}
button:hover { background: var(--hov); }
button:active { transform: scale(0.97); }
button.pri {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
}
button.pri:hover { filter: brightness(1.08); }

/* Ліва панель */
#side {
  position: absolute;
  z-index: 1000;
  top: 14px;
  left: 14px;
  width: 310px;
  max-height: calc(100% - 92px);
  display: flex;
  flex-direction: column;
}
#side header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 15px;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: .02em;
}
#side header span {
  display: flex;
  align-items: center;
  gap: 10px;
}
#side header span::before {
  content: '';
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold);
}
#tg { font-size: 18px; line-height: 1; padding: 4px 10px; }
#side.c #body { display: none; }
#body { overflow: auto; padding: 0 12px 14px; }

#srch {
  width: 100%;
  border: 1px solid var(--line);
  background: rgba(127, 127, 127, 0.08);
  border-radius: 11px;
  padding: 10px 12px;
  margin-bottom: 10px;
  font-size: 14px;
  transition: border-color .2s;
}
#srch:focus { border-color: var(--gold); }

/* Вкладки базових карт */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  margin: 6px 0 12px;
  background: rgba(127, 127, 127, 0.12);
  padding: 4px;
  border-radius: 12px;
}
.tabs button {
  font-size: 12.5px;
  padding: 7px 4px;
  border-radius: 9px;
  font-weight: 500;
  white-space: nowrap;
}
.tabs button.on {
  background: #ffffff;
  color: #0f172a;
  font-weight: 700;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

.sub {
  color: var(--mut);
  font-size: 11.5px;
  font-weight: 700;
  margin: 12px 4px 6px;
  text-transform: uppercase;
  letter-spacing: .07em;
}

.row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 9px;
  border-radius: 11px;
  font-size: 14px;
  margin-bottom: 3px;
  transition: background .15s, border-color .15s;
}
.row:hover { background: var(--hov); }
.row.act {
  background: rgba(245, 180, 0, 0.14);
  border: 1px solid rgba(245, 180, 0, 0.5);
}
.row input[type=checkbox] {
  accent-color: var(--acc);
  cursor: pointer;
  width: 17px;
  height: 17px;
  border-radius: 4px;
}
.row .nm {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
  font-weight: 600;
}
.row small {
  color: var(--mut);
  background: rgba(127, 127, 127, 0.16);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
}
.row button { padding: 4px 8px; opacity: .75; font-size: 14px; }
.row button:hover { opacity: 1; }

#addl, #syncmm {
  width: 100%;
  text-align: left;
  margin-top: 6px;
  font-size: 13.5px;
  padding: 9px 12px;
  font-weight: 500;
}

/* Верхній тулбар інструментів */
#tb {
  position: absolute;
  z-index: 1000;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: 6px 8px;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: calc(100% - 360px);
}
body.adm #tb { display: flex; animation: sl .3s ease; }
#tb button {
  font-weight: 700;
  font-size: 13.5px;
  padding: 8px 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

#adm {
  position: absolute;
  z-index: 1000;
  right: 14px;
  bottom: 26px;
  padding: 10px 16px;
  font-size: 13.5px;
  font-weight: 600;
}
body.adm #adm { border-color: rgba(245, 180, 0, 0.65); color: var(--gold); }

#done {
  position: absolute;
  z-index: 1000;
  bottom: 78px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: 11px 22px;
  font-size: 14.5px;
}

#toast {
  position: absolute;
  z-index: 2000;
  bottom: 78px;
  left: 50%;
  transform: translateX(-50%);
  padding: 11px 18px;
  display: none;
  font-weight: 600;
  font-size: 14px;
}

/* Модальне вікно */
#ov {
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0, 0, 0, 0.62);
  backdrop-filter: blur(5px);
  display: none;
  align-items: center;
  justify-content: center;
}
#md { width: 380px; max-width: 92vw; padding: 20px; }
#md h3 { margin: 0 0 14px; font-size: 17px; }
#md label { display: block; margin-bottom: 12px; color: var(--mut); font-size: 13px; }
#md input:not([type=color]), #md textarea, #md select {
  display: block;
  width: 100%;
  margin-top: 5px;
  padding: 9px 12px;
  background: rgba(127, 127, 127, 0.08);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--fg);
  font-size: 14px;
}
#md input[type=color] { width: 54px; height: 34px; padding: 2px; border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer; }
#md select option { color: #000; }
#md textarea { min-height: 85px; resize: vertical; }
.btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.pin {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 0 0 2px rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.55);
}
.leaflet-popup-content-wrapper, .leaflet-popup-tip {
  background: var(--bg);
  backdrop-filter: blur(14px);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.leaflet-popup-content { margin: 12px 14px; font-size: 14px; }
.pp b { display: block; font-size: 15.5px; margin-bottom: 5px; }
.pp div { white-space: pre-wrap; color: var(--mut); font-size: 13.5px; }
.pp .a { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.pp .a button { border: 1px solid var(--line); padding: 5px 10px; font-size: 12.5px; font-weight: 500; }

.leaflet-control-zoom { border: none !important; box-shadow: var(--shadow) !important; border-radius: 12px !important; overflow: hidden; }
.leaflet-control-zoom a { width: 36px !important; height: 36px !important; line-height: 36px !important; font-size: 18px !important; background: var(--bg) !important; color: var(--fg) !important; border-bottom: 1px solid var(--line) !important; backdrop-filter: blur(12px); }

@media (max-width: 700px) {
  #tb { top: auto; bottom: 78px; max-width: calc(100% - 24px); }
  #side { width: 260px; }
}

/* === ІНТРО-АНІМАЦІЯ З ФОТО НА ФОНІ === */
#intro {
  position: fixed;
  inset: 0;
  z-index: 5000;
  background: #05080f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  overflow: hidden;
  transition: opacity .85s cubic-bezier(.4,0,.2,1), visibility .85s;
}
#intro.out { opacity: 0; visibility: hidden; pointer-events: none; }

#intro .bg-img {
  position: absolute;
  inset: -4%;
  background: url('logo.jpg') center/contain no-repeat;
  opacity: 0;
  filter: drop-shadow(0 0 50px rgba(245, 180, 0, 0.35));
  animation: bgZoom 3.2s cubic-bezier(.16, 1, .3, 1) forwards;
}
#intro::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(5, 8, 15, 0.3) 0%, rgba(5, 8, 15, 0.92) 80%);
  z-index: 1;
}

#intro .cnt {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 20px;
  margin-top: min(37vh, 250px);
}
#intro .tag {
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: .22em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 6px;
  opacity: 0;
  animation: fu .7s .2s cubic-bezier(.16, 1, .3, 1) forwards;
}
#intro h1 {
  margin: 0;
  font-size: clamp(26px, 5.5vw, 46px);
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
  text-shadow: 0 4px 24px rgba(0,0,0,0.9);
  opacity: 0;
  animation: fu .8s .35s cubic-bezier(.16, 1, .3, 1) forwards;
}
#intro i {
  display: block;
  height: 3px;
  width: 0;
  margin: 12px 0;
  border-radius: 3px;
  background: linear-gradient(90deg, #1e88e5, #ffd600);
  box-shadow: 0 0 14px rgba(255, 214, 0, 0.6);
  animation: ln 1.5s .45s cubic-bezier(.16, 1, .3, 1) forwards;
}
#intro p {
  margin: 0;
  color: #cbd5e1;
  font-size: 13.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  opacity: 0;
  animation: fu .8s .65s cubic-bezier(.16, 1, .3, 1) forwards;
}

@keyframes bgZoom {
  0% { opacity: 0; transform: scale(0.92); }
  25% { opacity: 0.85; }
  100% { opacity: 0.7; transform: scale(1.06); }
}
@keyframes fu {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}
@keyframes ln {
  to { width: min(300px, 68vw); }
}
#side, #adm { animation: sl .8s 1.9s both; }
@keyframes sl {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  #intro, #intro *, #side, #adm { animation: none !important; transition: none !important; }
  #intro .tag, #intro h1, #intro p, #intro .bg-img { opacity: 1; }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="intro">
  <div class="bg-img"></div>
  <div class="cnt">
    <div class="tag">УКРОККУПАНТ • UKR LIBERATION</div>
    <h1>Карта подій в Україні</h1>
    <i></i>
    <p>Оперативна карта • ТОТ та лінія фронту</p>
  </div>
</div>

<div id="side" class="box">
  <header><span>UKR LIBERATION</span><button id="tg" title="Згорнути">–</button></header>
  <div id="body">
    <input id="srch" placeholder="Пошук населеного пункту...">
    <div class="tabs" id="bm"></div>
    <div class="sub">Шари карти</div>
    <div id="ls"></div>
    <div id="ladd" style="display:none">
      <button id="addl">+ Новий шар</button>
      <button id="syncmm">🔄 Оновити з My Maps</button>
    </div>
  </div>
</div>

<div id="tb" class="box">
  <button data-t="marker">📍 Мітка</button>
  <button data-t="polyline">〰️ Лінія</button>
  <button data-t="polygon">⬠ Полігон</button>
  <button data-t="rectangle">▭ Прямокутник</button>
  <button data-t="circle">⭕ Коло</button>
</div>

<button id="done" class="box pri">✓ Зберегти форму</button>
<div id="toast" class="box"></div>
<button id="adm" class="box">Зайти як адмін</button>
<div id="ov"><div id="md" class="box"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
const CODE = 'admin1488';
const KEY = 'ukr_liberation_map_v2';
const MM_MID = '1XedIqBnroHHVEPa-kAKoWu02-QerG-s';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const rv = a => [a[1], a[0]];

let admin = false, active = null, cur = null, shapeEd = null, state = load(), groups = {}, objs = {};

function defaultState() {
  return {
    layers: [
      { id: 'tot', name: 'ТОТ', visible: true },
      { id: 'front', name: 'Лінія фронту', visible: true },
      { id: 'lib', name: 'Звільнення та події', visible: true }
    ],
    feats: [],
    mmImported: false
  };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.layers) && Array.isArray(s.feats)) return s;
  } catch (e) {}
  return defaultState();
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

function toast(t) {
  const e = $('#toast');
  e.textContent = t;
  e.style.display = 'block';
  clearTimeout(e._t);
  e._t = setTimeout(() => e.style.display = 'none', 2800);
}

function modal(h) { $('#md').innerHTML = h; $('#ov').style.display = 'flex'; }
function closeM() { $('#ov').style.display = 'none'; }
$('#ov').onclick = e => { if (e.target.id === 'ov') closeM(); };

/* Карта та вкладки підкладок */
const map = L.map('map', { zoomControl: false, worldCopyJump: true }).setView([48.7, 31.3], 6);
L.control.zoom({ position: 'topright' }).addTo(map);
const tl = (u, o) => L.tileLayer(u, Object.assign({ maxZoom: 19 }, o));

const bases = {
  'Супутник': L.layerGroup([
    tl('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' }),
    tl('https://mt{s}.google.com/vt/lyrs=h&hl=uk&x={x}&y={y}&z={z}', { subdomains: '0123', attribution: '© Google' })
  ]),
  'Карта': tl('https://mt{s}.google.com/vt/lyrs=m&hl=uk&x={x}&y={y}&z={z}', { subdomains: '0123', attribution: '© Google' }),
  'Темна': tl('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OSM, CARTO' }),
  'Рельєф': tl('https://tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenTopoMap' })
};

let bcur = null;
function setBase(n) {
  if (bcur) map.removeLayer(bcur);
  bcur = bases[n];
  bcur.addTo(map);
  document.querySelectorAll('#bm button').forEach(b => b.classList.toggle('on', b.textContent === n));
  try { localStorage.setItem(KEY + '_b', n); } catch (e) {}
}
Object.keys(bases).forEach(n => {
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => setBase(n);
  $('#bm').appendChild(b);
});
let sb = 'Супутник';
try { sb = localStorage.getItem(KEY + '_b') || sb; } catch (e) {}
setBase(bases[sb] ? sb : 'Супутник');

/* Об'єкти на карті */
function mk(f) {
  const p = f.gj.properties, c = p.color || '#dc2626', g = f.gj.geometry;
  let l;
  if (g.type === 'Point') {
    const ll = rv(g.coordinates);
    l = p.radius
      ? L.circle(ll, { radius: p.radius, color: c, fillColor: c, fillOpacity: .22, weight: 2.5 })
      : L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="pin" style="background:' + c + '"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) });
  } else if (g.type === 'LineString') {
    l = L.polyline(g.coordinates.map(rv), { color: c, weight: 3.5 });
  } else {
    l = L.polygon(g.coordinates.map(r => r.map(rv)), { color: c, weight: 2.5, fillColor: c, fillOpacity: .32 });
  }
  l._g = f.layer;
  l._id = f.id;
  l.bindPopup(() => pop(f));
  (groups[f.layer] || (groups[f.layer] = L.featureGroup())).addLayer(l);
  objs[f.id] = l;
}

function pop(f) {
  const p = f.gj.properties;
  return '<div class="pp"><b>' + esc(p.name || 'Без назви') + '</b>' +
    (p.desc ? '<div>' + esc(p.desc) + '</div>' : '') +
    (admin ? '<div class="a"><button onclick="ed(\'' + f.id + '\')">Змінити</button><button onclick="sh(\'' + f.id + '\')">Форма</button><button onclick="dl(\'' + f.id + '\')">Видалити</button></div>' : '') +
    '</div>';
}

function build() {
  Object.values(groups).forEach(g => map.removeLayer(g));
  groups = {};
  objs = {};
  state.layers.forEach(l => groups[l.id] = L.featureGroup());
  state.feats.forEach(mk);
  state.layers.forEach(l => { if (l.visible) groups[l.id].addTo(map); });
  panel();
}

function refeat(f) {
  const o = objs[f.id];
  if (o) groups[o._g].removeLayer(o);
  mk(f);
  const ly = state.layers.find(l => l.id === f.layer);
  if (groups[f.layer] && ly && ly.visible && !map.hasLayer(groups[f.layer])) {
    groups[f.layer].addTo(map);
  }
}

const byId = id => state.feats.find(f => f.id === id);
window.ed = id => { map.closePopup(); openEdit(id); };
window.dl = id => {
  if (!admin || !confirm('Видалити цей об’єкт?')) return;
  map.closePopup();
  const o = objs[id];
  if (o) groups[o._g].removeLayer(o);
  delete objs[id];
  state.feats = state.feats.filter(f => f.id !== id);
  save();
  panel();
};
window.sh = id => {
  map.closePopup();
  const l = objs[id];
  if (!l || !l.editing) return;
  stopDraw();
  shapeEd = id;
  l.editing.enable();
  $('#done').style.display = 'block';
};
$('#done').onclick = () => {
  const l = objs[shapeEd], f = byId(shapeEd);
  if (l && f) {
    l.editing.disable();
    const j = l.toGeoJSON();
    f.gj.geometry = j.geometry;
    if (l.getRadius) f.gj.properties.radius = l.getRadius();
    save();
  }
  shapeEd = null;
  $('#done').style.display = 'none';
};

function openEdit(id) {
  const f = byId(id), p = f.gj.properties;
  modal('<h3>Налаштування об’єкта</h3>' +
    '<label>Назва<input id="m1" value="' + esc(p.name) + '"></label>' +
    '<label>Опис<textarea id="m2">' + esc(p.desc) + '</textarea></label>' +
    '<label>Колір<br><input type="color" id="m3" value="' + (p.color || '#dc2626') + '"></label>' +
    '<label>Шар<select id="m4">' + state.layers.map(l => '<option value="' + l.id + '"' + (l.id === f.layer ? ' selected' : '') + '>' + esc(l.name) + '</option>').join('') + '</select></label>' +
    '<div class="btns"><button id="mc">Скасувати</button><button id="ms" class="pri">Зберегти</button></div>');
  $('#mc').onclick = closeM;
  $('#ms').onclick = () => {
    p.name = $('#m1').value;
    p.desc = $('#m2').value;
    p.color = $('#m3').value;
    f.layer = $('#m4').value;
    save();
    refeat(f);
    panel();
    closeM();
  };
}

/* Панель шарів */
function panel() {
  const el = $('#ls');
  el.innerHTML = '';
  state.layers.forEach(ly => {
    const n = state.feats.filter(f => f.layer === ly.id).length;
    const d = document.createElement('div');
    d.className = 'row' + (admin && active === ly.id ? ' act' : '');
    d.innerHTML = '<input type="checkbox"' + (ly.visible ? ' checked' : '') + '>' +
      '<span class="nm" title="' + esc(ly.name) + '">' + esc(ly.name) + '</span>' +
      '<small>' + n + '</small>' +
      (admin ? '<button data-a="r" title="Перейменувати">✎</button><button data-a="x" title="Видалити шар">×</button>' : '');
    d.querySelector('input').onchange = e => {
      ly.visible = e.target.checked;
      save();
      ly.visible ? groups[ly.id].addTo(map) : map.removeLayer(groups[ly.id]);
    };
    d.querySelector('.nm').onclick = () => { if (admin) { active = ly.id; panel(); } };
    const r = d.querySelector('[data-a=r]'), x = d.querySelector('[data-a=x]');
    if (r) r.onclick = () => {
      const v = prompt('Назва шару', ly.name);
      if (v) { ly.name = v; save(); panel(); }
    };
    if (x) x.onclick = () => {
      if (!confirm('Видалити шар «' + ly.name + '» разом з усіма об’єктами?')) return;
      state.feats = state.feats.filter(f => f.layer !== ly.id);
      state.layers = state.layers.filter(l => l !== ly);
      if (active === ly.id) active = state.layers[0] && state.layers[0].id;
      save();
      build();
    };
    el.appendChild(d);
  });
  if (!state.layers.length) el.innerHTML = '<div class="row"><small>Шарів немає</small></div>';
}

$('#addl').onclick = () => {
  const v = prompt('Назва нового шару');
  if (!v) return;
  const l = { id: uid(), name: v, visible: true };
  state.layers.push(l);
  active = l.id;
  save();
  build();
};
$('#tg').onclick = () => {
  const s = $('#side');
  s.classList.toggle('c');
  $('#tg').textContent = s.classList.contains('c') ? '+' : '–';
};

/* Пошук */
$('#srch').onkeydown = async e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim();
  if (!q) return;
  try {
    const r = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q))).json();
    if (r[0]) {
      const b = r[0].boundingbox;
      map.fitBounds([[+b[0], +b[2]], [+b[1], +b[3]]], { maxZoom: 14 });
    } else toast('Нічого не знайдено');
  } catch (x) { toast('Пошук недоступний'); }
};

/* Малювання */
function stopDraw() { if (cur) { cur.disable(); cur = null; } }
document.querySelectorAll('#tb button').forEach(b => b.onclick = () => {
  if (!admin) return;
  if (!active || !state.layers.find(l => l.id === active)) return toast('Спершу оберіть шар у панелі зліва');
  stopDraw();
  const t = b.dataset.t, o = { shapeOptions: { color: '#dc2626' } };
  cur = t === 'marker'
    ? new L.Draw.Marker(map, { icon: L.divIcon({ className: '', html: '<div class="pin" style="background:#dc2626"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) })
    : t === 'polyline' ? new L.Draw.Polyline(map, o)
    : t === 'polygon' ? new L.Draw.Polygon(map, o)
    : t === 'rectangle' ? new L.Draw.Rectangle(map, o)
    : new L.Draw.Circle(map, o);
  cur.enable();
});

map.on(L.Draw.Event.CREATED, e => {
  cur = null;
  const l = e.layer, j = l.toGeoJSON();
  const f = { id: uid(), layer: active, gj: { type: 'Feature', properties: { name: '', desc: '', color: '#dc2626' }, geometry: j.geometry } };
  if (l instanceof L.Circle) f.gj.properties.radius = l.getRadius();
  state.feats.push(f);
  save();
  mk(f);
  if (!map.hasLayer(groups[active])) groups[active].addTo(map);
  panel();
  openEdit(f.id);
});

/* Підвантаження шарів і об'єктів з Google My Maps (MID) */
const kc = s => {
  s = (s || '').trim();
  return s.length >= 8 ? '#' + s.slice(6, 8) + s.slice(4, 6) + s.slice(2, 4) : null;
};

function parseKMLIntoState(txt) {
  const d = new DOMParser().parseFromString(txt, 'text/xml');
  if (!d.querySelector('Placemark')) return 0;

  const st = {};
  d.querySelectorAll('Style[id]').forEach(s => {
    const g = t => { const e = s.querySelector(t + ' > color'); return e && kc(e.textContent); };
    st[s.id] = g('LineStyle') || g('PolyStyle') || g('IconStyle');
  });
  d.querySelectorAll('StyleMap[id]').forEach(m => m.querySelectorAll('Pair').forEach(p => {
    const k = p.querySelector('key');
    if (k && k.textContent === 'normal') {
      const u = p.querySelector('styleUrl');
      if (u) st[m.id] = st[u.textContent.replace('#', '')];
    }
  }));

  const co = t => (t ? t.textContent : '').trim().split(/\s+/)
    .map(s => s.split(',').map(Number))
    .filter(a => a.length >= 2 && !isNaN(a[0]) && !isNaN(a[1]))
    .map(a => [a[0], a[1]]);

  const lm = {};
  const ensureLayer = name => {
    const clean = (name || 'ТОТ').trim();
    if (lm[clean]) return lm[clean];
    const existing = state.layers.find(x => x.name.toLowerCase() === clean.toLowerCase());
    if (existing) { lm[clean] = existing; return existing; }
    const l = { id: uid(), name: clean, visible: true };
    state.layers.push(l);
    lm[clean] = l;
    return l;
  };

  let added = 0;
  d.querySelectorAll('Placemark').forEach(pm => {
    let fo = pm.parentElement;
    while (fo && fo.tagName !== 'Folder') fo = fo.parentElement;
    let ln = 'ТОТ';
    if (fo) {
      const n = Array.from(fo.children).find(c => c.tagName === 'name');
      if (n && n.textContent.trim()) ln = n.textContent.trim();
    }
    const ly = ensureLayer(ln);
    const ne = Array.from(pm.children).find(c => c.tagName === 'name');
    const de = Array.from(pm.children).find(c => c.tagName === 'description');
    const su = Array.from(pm.children).find(c => c.tagName === 'styleUrl');
    const desc = de ? new DOMParser().parseFromString(de.textContent.replace(/<br\s*\/?>/gi, '\n'), 'text/html').body.textContent.trim() : '';
    const color = (su && st[su.textContent.replace('#', '')]) || '#dc2626';

    pm.querySelectorAll('Point,LineString,Polygon').forEach(g => {
      let geo;
      if (g.tagName === 'Point') {
        const c = co(g.querySelector('coordinates'));
        if (c[0]) geo = { type: 'Point', coordinates: c[0] };
      } else if (g.tagName === 'LineString') {
        const c = co(g.querySelector('coordinates'));
        if (c.length > 1) geo = { type: 'LineString', coordinates: c };
      } else {
        const rings = [], o = g.querySelector('outerBoundaryIs coordinates');
        if (o) rings.push(co(o));
        g.querySelectorAll('innerBoundaryIs coordinates').forEach(i => rings.push(co(i)));
        if (rings[0] && rings[0].length > 2) geo = { type: 'Polygon', coordinates: rings };
      }
      if (geo) {
        state.feats.push({
          id: uid(),
          layer: ly.id,
          gj: { type: 'Feature', properties: { name: ne ? ne.textContent.trim() : '', desc, color }, geometry: geo }
        });
        added++;
      }
    });
  });
  return added;
}

async function syncFromMyMaps(manual = false) {
  const kmlUrl = `https://www.google.com/maps/d/u/0/kml?forcekml=1&mid=${encodeURIComponent(MM_MID)}`;
  const candidates = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(kmlUrl)}`,
    `https://corsproxy.io/?${encodeURIComponent(kmlUrl)}`
  ];
  for (const url of candidates) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const txt = await res.text();
      if (manual) {
        state.feats = [];
      }
      const n = parseKMLIntoState(txt);
      if (n > 0) {
        state.mmImported = true;
        save();
        build();
        if (manual) toast(`Завантажено об’єктів з My Maps: ${n}`);
        return true;
      }
    } catch (e) {}
  }
  if (manual) toast('Не вдалося отримати доступ до My Maps (перевірте доступ за посиланням)');
  return false;
}

$('#syncmm').onclick = () => syncFromMyMaps(true);

/* Режим адміністратора */
function setAdmin(v) {
  admin = v;
  document.body.classList.toggle('adm', v);
  $('#adm').textContent = v ? 'Вийти з режиму адміна' : 'Зайти як адмін';
  $('#ladd').style.display = v ? 'block' : 'none';
  if (v && !active) active = state.layers[0] && state.layers[0].id;
  if (!v) { stopDraw(); if (shapeEd) $('#done').onclick(); }
  map.closePopup();
  panel();
}

$('#adm').onclick = () => {
  if (admin) return setAdmin(false);
  modal('<h3>Вхід для адміністратора</h3>' +
    '<label>Код доступу<input id="pw" type="password" autocomplete="off"></label>' +
    '<div id="er" style="color:#ef4444;font-size:13px;min-height:18px"></div>' +
    '<div class="btns"><button id="mc">Скасувати</button><button id="ms" class="pri">Увійти</button></div>');
  const go = () => {
    if ($('#pw').value.trim().toLowerCase() === CODE) { closeM(); setAdmin(true); }
    else $('#er').textContent = 'Невірний код';
  };
  $('#mc').onclick = closeM;
  $('#ms').onclick = go;
  $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#pw').focus();
};

build();
